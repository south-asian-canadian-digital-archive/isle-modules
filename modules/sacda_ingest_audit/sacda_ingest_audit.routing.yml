sacda_ingest_audit.page:
  path: '/admin/content/ingest-audit'
  defaults:
    _controller: '\Drupal\sacda_ingest_audit\Controller\IngestAuditController::page'
    _title: 'Ingest audit'
  requirements:
    _permission: 'use ingest audit'

# Server-side fetch of a Google Sheets CSV export: Google does not send CORS
# headers, so the browser cannot read it directly. Locked to docs.google.com.
sacda_ingest_audit.sheet:
  path: '/admin/content/ingest-audit/sheet'
  defaults:
    _controller: '\Drupal\sacda_ingest_audit\Controller\IngestAuditController::sheet'
  methods: [GET]
  requirements:
    _permission: 'use ingest audit'
    _csrf_token: 'TRUE'
  options:
    no_cache: TRUE

# AI triage queue (see triage() / queue()). The browser posts open
# differences here; an agent on someone's machine answers them via the queue.
sacda_ingest_audit.triage:
  path: '/admin/content/ingest-audit/triage'
  defaults:
    _controller: '\Drupal\sacda_ingest_audit\Controller\IngestAuditController::triage'
  methods: [POST]
  requirements:
    _permission: 'use ingest audit'
    _csrf_token: 'TRUE'
  options:
    no_cache: TRUE

# Agent side of the triage queue. No Drupal login: the controller checks the
# X-Triage-Token header against the state value, and 403s when it is unset.
sacda_ingest_audit.triage_queue:
  path: '/ingest-audit/triage-queue'
  defaults:
    _controller: '\Drupal\sacda_ingest_audit\Controller\IngestAuditController::queue'
  methods: [GET, POST]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE
