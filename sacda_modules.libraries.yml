exhibit_loader:
  version: 1.x
  js:
    js/sacda-exhibit.js: { attributes: { defer: true } }

year-range:
  version: VERSION
  js:
    js/year-range.js: { attributes: { defer: true } }
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once

place_lookup:
  version: VERSION
  js:
    js/place-lookup.js: { attributes: { defer: true } }
  css:
    component:
      css/place-lookup.css: {}
  dependencies:
    - core/drupal
    # Drupal.announce() lives here, not in core/drupal — the copy confirmation
    # is silent to screen readers without it.
    - core/drupal.announce
    - core/drupalSettings
    - core/once
